# ---------------------------------------------------------------------------
# PROJECTS — case studies.
# ---------------------------------------------------------------------------
projects:
  heading: "Selected work"
  subheading: "Six services, the problem each one solved, and what changed as a result."
  items:
    - title: "GenAI backend services and APIs"
      org: "Intuit"
      tagline: "Python services connecting LLM workflows to production systems."
      problem: >
        LLM workflows needed access to production services and data without weakening security
        boundaries or making latency and cost unpredictable.
      approach: >
        Built GenAI-enabled backend capabilities and APIs in Python, with secure application
        flows, secrets handling, caching, payload optimization and query tuning — plus
        automated testing, structured logging, alerting and incident response around them.
      outcome: >
        GenAI capabilities running in production with reliability improved through automated
        testing, caching, database resilience and secure secrets handling.
      tags: ["Python", "FastAPI", "LLM integration", "OpenAI API", "Caching", "Testing"]

    - title: "High-performance Apple Wallet APIs"
      org: "Disney ABC"
      tagline: "Python and FastAPI with autoscaling — 10x faster."
      problem: >
        Wallet pass generation was too slow to keep up with demand, and the service could not
        scale with traffic spikes.
      approach: >
        Rebuilt the APIs in Python with FastAPI and autoscaling, profiling the hot paths and
        optimizing the ones that mattered.
      outcome: >
        A 10x speed improvement on the Apple Wallet APIs, holding under production traffic.
      tags: ["Python", "FastAPI", "Autoscaling", "Performance", "Profiling", "AWS"]

    - title: "ServiceNow incident automation"
      org: "Disney ABC"
      tagline: "Python services that took manual triage out of L2 response."
      problem: >
        Level-2 incidents were routed and triaged by hand, adding delay to every production issue.
      approach: >
        Integrated Python services with ServiceNow for automated ticketing, wired into the
        monitoring, logging and alerting that produced the signals.
      outcome: >
        Automated L2 ticketing with measurably improved incident response workflows.
      tags: ["Python", "ServiceNow", "Automation", "Integration", "Incident response"]

    - title: "Streaming and batch pipelines in Python"
      org: "Medtronic"
      tagline: "Validation, anomaly detection and SLAs on clinical data."
      problem: >
        Clinical analytics depended on batch and streaming sources of uneven quality, under
        privacy rules that constrained logging and access.
      approach: >
        Architected production Python pipelines with Airflow orchestration — retries,
        backfills, dependency controls, quality checks — plus schema validation, anomaly
        detection, monitoring and PHI-safe logging.
      outcome: >
        Trusted, reusable datasets serving ML, BI and operational reporting, with data quality
        and privacy controls improving reliability across every downstream workflow.
      tags: ["Python", "Airflow", "PySpark", "Kafka", "Data quality", "Anomaly detection"]

    - title: "On-sale performance engineering"
      org: "Live Nation / Ticketmaster"
      tagline: "Hours to minutes, with the automation to verify it."
      problem: >
        Presale and on-sale processing ran for hours under peak demand, with limited visibility
        into behaviour differences between environments.
      approach: >
        Optimized the processing path with caching and timeout handling, standardized API error
        handling and structured JSON responses, and wrote Shell and Python automation to
        simulate and compare API behaviour across environments.
      outcome: >
        10x performance improvement — hours reduced to minutes — on the systems carrying
        on-sale traffic for millions of fans.
      tags: ["Python", "Shell", "Performance", "API design", "Caching", "Automation"]

    - title: "Payroll microservices migration"
      org: "ADP"
      tagline: "45% lower latency, 20%+ fewer production defects."
      problem: >
        Monolithic payroll applications limited throughput, and defect rates were high enough
        to slow every release.
      approach: >
        Decomposed the monolith into microservices on AWS, optimized GraphQL APIs over Aurora
        and DynamoDB, and introduced type-safety standards and component-based architecture
        across the codebase.
      outcome: >
        45% lower API latency, higher throughput, and a 20%+ reduction in production defects.
      tags: ["Microservices", "GraphQL", "Type safety", "AWS", "Performance", "Standards"]

