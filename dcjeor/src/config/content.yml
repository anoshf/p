# ---------------------------------------------------------------------------
# PROJECTS — case studies. Problem → approach → outcome is deliberate:
# it is the structure interviewers are trained to listen for.
# ---------------------------------------------------------------------------
projects:
  heading: "Selected work"
  subheading: "Six systems, the problem each one solved, and what changed as a result."
  items:
    - title: "GenAI data and backend services"
      org: "Intuit"
      tagline: "Connecting LLM workflows to real production data, safely."
      problem: >
        LLM workflows needed access to production data and services without weakening security
        boundaries or introducing unpredictable latency and cost.
      approach: >
        Built GenAI-enabled backend capabilities and APIs bridging LLM workflows to production
        services and data access, with secure application flows, secrets handling, caching and
        payload optimization. Orchestrated the supporting batch workflows in Airflow with
        retries, backfills, dependency controls and data validation.
      outcome: >
        GenAI capabilities running against production data with reliability improved through
        automated testing, caching, database resilience and secure secrets handling.
      tags: ["GenAI", "LLM workflows", "Python", "Airflow", "AWS", "Semantic caching"]

    - title: "Clinical analytics pipeline platform"
      org: "Medtronic"
      tagline: "Trusted datasets for ML, BI and operational reporting — under PHI constraints."
      problem: >
        Clinical analytics depended on data arriving from batch and streaming sources with
        inconsistent quality, while privacy rules constrained how any of it could be logged or accessed.
      approach: >
        Architected Python pipelines combining batch and streaming ingestion on Kafka, Kinesis,
        S3, Redshift, Glue and Athena. Modeled feature tables in Snowflake with dbt. Layered in
        schema validation, anomaly detection, monitoring and alerting, plus PHI-safe logging,
        IAM least privilege, encryption and audit trails.
      outcome: >
        Trusted, reusable datasets serving ML, BI and operational reporting, with data quality,
        monitoring, governance and privacy controls that improved reliability of clinical
        analytics and every downstream workflow.
      tags: ["Streaming", "Snowflake", "dbt", "Data governance", "PHI-safe logging", "Airflow"]

    - title: "Enterprise financial event platform"
      org: "ADP"
      tagline: "99.999% data consistency across enterprise payroll and financial events."
      problem: >
        Monolithic payroll systems coupled services tightly, limiting throughput and making
        financial event delivery fragile.
      approach: >
        Designed a high-throughput Kafka platform with disaster recovery, then migrated
        monolithic payroll capabilities to microservices on AWS EKS provisioned with Terraform.
        Optimized GraphQL APIs over Aurora and DynamoDB for performance-critical workloads.
      outcome: >
        99.999% data consistency, 45% lower API latency, 30% lower infrastructure cost, and
        99.99% uptime with 60% faster incident resolution.
      tags: ["Kafka", "Microservices", "AWS EKS", "Terraform", "GraphQL", "Disaster recovery"]

    - title: "Global newsroom collaboration platform"
      org: "Disney ABC"
      tagline: "Real-time content for global newsrooms at sub-100ms search latency."
      problem: >
        Newsrooms across regions needed real-time access to shared content with no tolerance for
        regional outages or slow search.
      approach: >
        Architected a highly available, active-active multi-region AWS platform with multi-CDN
        delivery, backed by resilient Kafka and Cassandra event pipelines and enterprise SAML2 /
        OAuth2 authentication.
      outcome: >
        Real-time content delivery at sub-100ms search latency, globally, with regional failure
        tolerance built into the architecture.
      tags: ["Multi-region", "Kafka", "Cassandra", "Multi-CDN", "High availability"]

    - title: "Mobile ticketing at stadium scale"
      org: "Live Nation / Ticketmaster"
      tagline: "Physical tickets to secure Apple Wallet passes, for millions of fans."
      problem: >
        Physical ticketing throttled venue entry, and presale and on-sale processing ran for
        hours during peak demand.
      approach: >
        Built a globally scalable cloud platform converting physical tickets into secure Apple
        Wallet passes on dockerized EC2 microservices provisioned by CloudFormation, with
        centralized logging and monitoring via Sumo Logic, New Relic and CloudWatch.
      outcome: >
        Mobile venue entry at high volume for millions of fans worldwide, with presale and
        on-sale performance improved 10x — hours reduced to minutes.
      tags: ["Apple Wallet", "AWS", "Docker", "CloudFormation", "Performance", "Monitoring"]

    - title: "Automated L2 incident workflows"
      org: "Disney ABC"
      tagline: "Python services wired into ServiceNow to shorten incident response."
      problem: >
        Level-2 incidents were routed and triaged manually, adding delay to every production issue.
      approach: >
        Integrated Python services with ServiceNow for automated ticketing, and built the
        monitoring, logging and alerting that fed it.
      outcome: >
        Automated L2 ticketing with measurably improved incident response workflows.
      tags: ["Python", "ServiceNow", "Automation", "Incident response", "Observability"]

