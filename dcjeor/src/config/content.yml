# ---------------------------------------------------------------------------
# POSITIONING — the "why this person for this exact role" argument.
# ---------------------------------------------------------------------------
positioning:
  heading: "Why I'm a fit for AI data engineering"
  subheading: >
    Most AI projects stall on data, not models. These are the three things I've been hired
    to fix, repeatedly, for 18 years.
  pillars:
    - title: "AI-ready data, not just clean data"
      body: >
        I build the ingestion, chunking, embedding and retrieval paths that GenAI systems
        actually depend on — plus the batch and streaming pipelines feeding ML training and
        BI underneath them. At Intuit that means connecting LLM workflows to production data
        access and secure application flows.
      tags: ["RAG pipelines", "Vector databases", "Embeddings", "LangChain", "Semantic caching"]

    - title: "Quality and governance built in, not bolted on"
      body: >
        Schema validation, anomaly detection, lineage, alerting and least-privilege access
        designed in from the start. At Medtronic that meant PHI-safe logging, encryption and
        audit trails on clinical analytics pipelines that ML, BI and operations all relied on.
      tags: ["Data quality", "Observability", "Data governance", "PHI-safe logging", "Audit trails"]

    - title: "Scale and cost, proven under load"
      body: >
        A 99.999%-consistency Kafka platform for enterprise financial events. Multi-region
        systems at sub-100ms latency. 30% infrastructure cost reduction through Terraform and
        EKS. I optimize partitioning, indexing, caching and queries because the bill and the
        SLA are both my problem.
      tags: ["Kafka", "Streaming", "Query tuning", "Cost optimization", "Terraform"]

