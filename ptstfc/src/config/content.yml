# ---------------------------------------------------------------------------
# PROJECTS — case studies.
# ---------------------------------------------------------------------------
projects:
  heading: "Selected work"
  subheading: "Six platforms, the problem each one solved, and what changed as a result."
  items:
    - title: "Enterprise event platform on Kafka and EKS"
      org: "ADP"
      tagline: "99.999% consistency, 99.99% uptime, 30% less infrastructure spend."
      problem: >
        Monolithic payroll systems coupled services tightly, capped throughput, and made every
        production incident slow to diagnose.
      approach: >
        Designed a high-throughput Kafka platform with disaster recovery, migrated payroll
        capabilities to microservices on AWS EKS provisioned with Terraform, and layered in
        observability — metrics, structured logging, tracing, dashboards and alerting.
      outcome: >
        99.999% data consistency, 99.99% uptime, 60% faster incident resolution, 45% lower API
        latency and 30% lower operational cost.
      tags: ["Kafka", "AWS EKS", "Terraform", "Observability", "Microservices", "DR"]

    - title: "GenAI platform capabilities"
      org: "Intuit"
      tagline: "LLM workflows wired into production services, safely and predictably."
      problem: >
        GenAI features needed production data and service access without weakening security
        boundaries or producing unpredictable latency and cost.
      approach: >
        Built GenAI-enabled backend capabilities and APIs bridging LLM workflows to production
        services, with secure application flows, secrets handling, caching and payload
        optimization, plus monitoring, alerting and incident response around them.
      outcome: >
        GenAI capabilities running in production with reliability improved through automated
        testing, caching, database resilience and secure secrets handling.
      tags: ["GenAI", "LLM workflows", "Secrets handling", "Semantic caching", "AWS", "Terraform"]

    - title: "Multi-region newsroom platform"
      org: "Disney ABC"
      tagline: "Active-active across regions at sub-100ms global latency."
      problem: >
        Global newsrooms needed shared real-time content with no tolerance for a regional
        outage taking the platform down.
      approach: >
        Architected a highly available, active-active multi-region AWS platform with multi-CDN
        delivery, resilient Kafka and Cassandra event pipelines, and infrastructure automated
        with Terraform and CloudFormation across AWS and Azure.
      outcome: >
        Real-time content delivery at sub-100ms search latency globally, with regional failure
        tolerance designed into the topology.
      tags: ["Multi-region", "High availability", "Multi-CDN", "Kafka", "Terraform", "Azure"]

    - title: "Infrastructure automation for clinical analytics"
      org: "Medtronic"
      tagline: "Repeatable Terraform and Kubernetes environments under PHI constraints."
      problem: >
        Clinical analytics workloads needed reproducible environments and operational SLAs
        while privacy rules constrained logging and access.
      approach: >
        Automated cloud infrastructure with Terraform and Kubernetes, built Airflow workflows
        with retries, backfills and quality gates, and established PHI-safe logging, IAM least
        privilege, encryption and audit trails.
      outcome: >
        Repeatable deployments and scalable production workloads with monitoring, governance
        and privacy controls that improved reliability across every downstream workflow.
      tags: ["Terraform", "Kubernetes", "Airflow", "Governance", "PHI-safe logging", "SLOs"]

    - title: "Ticketing platform under on-sale load"
      org: "Live Nation / Ticketmaster"
      tagline: "10x throughput and the monitoring to prove it held."
      problem: >
        Presale and on-sale processing ran for hours under peak demand, with limited visibility
        when it degraded.
      approach: >
        Built dockerized EC2 microservices provisioned by CloudFormation with ALB, S3, RDS and
        centralized logging, monitored through Sumo Logic, New Relic and CloudWatch, and
        automated deployment with Chef, Puppet and Knife.
      outcome: >
        10x performance improvement — hours reduced to minutes — supporting mobile venue entry
        at high volume for millions of fans worldwide.
      tags: ["AWS", "Docker", "CloudFormation", "Monitoring", "Chef", "Puppet"]

    - title: "Automated L2 incident workflows"
      org: "Disney ABC"
      tagline: "Python services wired into ServiceNow to shorten incident response."
      problem: >
        Level-2 incidents were routed and triaged by hand, adding delay to every production issue.
      approach: >
        Integrated Python services with ServiceNow for automated ticketing, backed by the
        monitoring, logging and alerting that fed it.
      outcome: >
        Automated L2 ticketing with measurably improved incident response workflows.
      tags: ["Python", "ServiceNow", "Automation", "Incident response", "Observability"]

