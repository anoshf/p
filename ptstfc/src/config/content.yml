# ---------------------------------------------------------------------------
# POSITIONING — the "why this person for this exact role" argument.
# ---------------------------------------------------------------------------
positioning:
  heading: "Why I'm a fit for AI platform engineering"
  subheading: >
    AI platform work is 20% novel and 80% the operational engineering that has always
    separated a demo from a system people depend on. I've been doing the 80% for 18 years.
  pillars:
    - title: "Reliability you can put a number on"
      body: >
        99.99% uptime and 60% faster incident resolution at ADP came from observability
        designed in, not added after an outage: metrics, logs, tracing, dashboards, alerting
        and runbooks. I've carried the pager for the systems I built.
      tags: ["Observability", "SLOs", "Incident response", "Runbooks", "Prometheus", "Grafana"]

    - title: "Infrastructure as a product, not a ticket queue"
      body: >
        Terraform and CloudFormation across AWS and Azure, EKS clusters, CI/CD pipelines and
        repeatable environments — so engineering, ML and analytics teams self-serve instead of
        waiting. A 30% infrastructure cost reduction came out of that same re-architecture.
      tags: ["Kubernetes", "Terraform", "CI/CD", "IaC", "Cost optimization", "Self-service"]

    - title: "AI workloads, with the operational parts handled"
      body: >
        At Intuit I connect LLM workflows to production services and data access with secure
        application flows, secrets handling, caching and payload optimization — the parts that
        decide whether a GenAI feature survives contact with production traffic and a budget.
      tags: ["MLOps", "LLM serving", "Semantic caching", "AWS Bedrock", "SageMaker", "Guardrails"]

