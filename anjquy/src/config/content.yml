# ---------------------------------------------------------------------------
# POSITIONING — the "why this person for this exact role" argument.
# ---------------------------------------------------------------------------
positioning:
  heading: "Why I'm a fit for AI cloud architecture"
  subheading: >
    Architecture is a series of tradeoffs someone has to defend. These are the three I get
    asked to make most often — and have made repeatedly across three clouds.
  pillars:
    - title: "Architecture that survives production"
      body: >
        Active-active multi-region microservices at sub-100ms global latency. A Kafka platform
        at 99.999% data consistency with disaster recovery. I design for the failure modes
        first, because those are the decisions that can't be refactored later.
      tags: ["Multi-region", "Active-active", "Event-driven", "Fault tolerance", "DR"]

    - title: "Multi-cloud, without the religion"
      body: >
        AWS, Azure and GCP, with infrastructure automated in Terraform and CloudFormation
        across all three. I've made build-vs-buy and vendor-lock-in calls and lived with them:
        one of those re-architectures cut infrastructure cost by 30%.
      tags: ["AWS", "Azure", "GCP", "Terraform", "Build vs buy", "Cost governance"]

    - title: "An architect who still writes the code"
      body: >
        I'm hands-on in Python, Java, Go, Node and TypeScript, and currently building
        GenAI-enabled backend capabilities at Intuit. Teams get designs that survive contact
        with an implementation, plus mentoring — colleagues consistently name that in
        recommendations below.
      tags: ["Hands-on", "Technical leadership", "Mentoring", "GenAI integration", "API design"]

