# ---------------------------------------------------------------------------
# PROJECTS — case studies.
# ---------------------------------------------------------------------------
projects:
  heading: "Selected work"
  subheading: "Six architectures, the constraint each one had to satisfy, and what it delivered."
  items:
    - title: "Global newsroom collaboration platform"
      org: "Disney ABC"
      tagline: "Active-active across regions, sub-100ms search, multi-CDN delivery."
      problem: >
        Newsrooms across regions needed shared real-time content, and a regional outage taking
        the platform offline was not an acceptable failure mode.
      approach: >
        Architected a highly available active-active multi-region AWS platform with multi-CDN
        delivery, backed by resilient Kafka and Cassandra event pipelines and enterprise
        SAML2 / OAuth2 authentication. Infrastructure automated with Terraform and
        CloudFormation across AWS and Azure.
      outcome: >
        Real-time content delivered globally at sub-100ms search latency, with regional
        failure tolerance designed into the topology rather than bolted on.
      tags: ["Multi-region", "Active-active", "Multi-CDN", "Kafka", "Cassandra", "SAML2"]

    - title: "Enterprise financial event platform"
      org: "ADP"
      tagline: "99.999% data consistency with disaster recovery, at enterprise payroll scale."
      problem: >
        Tightly coupled monolithic payroll systems limited throughput and made financial event
        delivery fragile — unacceptable for money movement.
      approach: >
        Designed a high-throughput Kafka platform with disaster recovery, decomposed payroll
        capabilities into microservices on AWS EKS provisioned with Terraform, and optimized
        GraphQL APIs over Aurora and DynamoDB.
      outcome: >
        99.999% data consistency, 45% lower API latency, 30% lower infrastructure cost, and
        99.99% uptime with 60% faster incident resolution.
      tags: ["Kafka", "Microservices", "AWS EKS", "Terraform", "GraphQL", "Disaster recovery"]

    - title: "GenAI integration architecture"
      org: "Intuit"
      tagline: "Where LLM workflows meet production data, and what guards the boundary."
      problem: >
        LLM workflows needed production service and data access without weakening security
        boundaries or making latency and cost unpredictable.
      approach: >
        Designed and built GenAI-enabled backend capabilities and APIs bridging LLM workflows
        to production services, with secure application flows, secrets handling, caching and
        payload optimization, on infrastructure automated in Terraform and CloudFormation.
      outcome: >
        GenAI capabilities running against production data with reliability improved through
        automated testing, caching, database resilience and secure secrets handling.
      tags: ["GenAI", "Integration architecture", "Security", "AWS", "Terraform", "APIs"]

    - title: "Clinical analytics data platform"
      org: "Medtronic"
      tagline: "Batch and streaming into trusted datasets, under PHI governance."
      problem: >
        Clinical analytics depended on batch and streaming sources of uneven quality, while
        privacy rules constrained how the data could be logged or accessed.
      approach: >
        Designed an AWS data platform on S3, Redshift, Glue, Athena, Lambda and RDS with
        Kafka and Kinesis ingestion, Snowflake feature tables modeled in dbt, and governance
        built in: PHI-safe logging, IAM least privilege, encryption and audit trails.
      outcome: >
        Trusted, reusable datasets feeding ML, BI and operational reporting, with governance
        and privacy controls that improved reliability across every downstream workflow.
      tags: ["AWS", "Snowflake", "dbt", "Kafka", "Governance", "PHI-safe logging"]

    - title: "Mobile ticketing at stadium scale"
      org: "Live Nation / Ticketmaster"
      tagline: "Physical tickets into secure Apple Wallet passes, for millions of fans."
      problem: >
        Physical ticketing throttled venue entry, and presale and on-sale processing ran for
        hours under peak demand.
      approach: >
        Built a globally scalable cloud platform converting physical tickets into secure Apple
        Wallet passes on dockerized EC2 microservices provisioned by CloudFormation with ALB,
        S3, RDS and centralized logging.
      outcome: >
        Mobile venue entry at high volume for millions of fans worldwide, with presale and
        on-sale performance improved 10x — hours reduced to minutes.
      tags: ["Apple Wallet", "AWS", "CloudFormation", "Docker", "Scalability", "Performance"]

    - title: "Weekly show management with ESB events"
      org: "Disney ABC"
      tagline: "Event-driven notifications engineered for congestion and network failure."
      problem: >
        Show management notifications had to survive network congestion and partial failures
        without dropping or duplicating events.
      approach: >
        Built an ABC application for managing weekly shows, driven by ESB event notifications
        with resilient multi-retry handling designed for congestion and network failures.
      outcome: >
        Reliable event notification under adverse network conditions, with retry behaviour
        that degraded gracefully instead of failing outright.
      tags: ["ESB", "Event-driven", "Retry handling", "Resilience", "Node.js"]

