# Builds all four role sites and publishes them as one GitHub Pages deployment.
#
#   anjquy/  →  https://<username>.github.io/anjquy/   AI Cloud & Software Architect
#   ptstfc/  →  https://<username>.github.io/ptstfc/   AI Platform Engineer
#   sjkqpy/  →  https://<username>.github.io/sjkqpy/   AI Python Developer
#   dcjeor/  →  https://<username>.github.io/dcjeor/   AI Data Engineer
#   root/index.html  →  https://<username>.github.io/
#
# One-time setup in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# After that, every push to main rebuilds and republishes all four.
name: Build and deploy role sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      - name: Build all four sites
        run: |
          set -euo pipefail
          mkdir -p _site
          for folder in anjquy ptstfc sjkqpy dcjeor; do
            echo "::group::Building $folder"
            npm ci --prefix "$folder"
            npm run build --prefix "$folder"
            # Fail loudly rather than publishing an empty folder.
            test -f "$folder/dist/index.html" || {
              echo "::error::$folder/dist/index.html missing — build produced no output"
              exit 1
            }
            mkdir -p "_site/$folder"
            cp -R "$folder/dist/." "_site/$folder/"
            echo "::endgroup::"
          done

      - name: Add the root landing page and its assets
        run: cp -R root/. _site/

      - name: Show what will be published
        run: find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
