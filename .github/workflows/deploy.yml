# Builds the eight role sites and the consulting site for GitHub Pages.
#
#   anj/     →  https://<username>.github.io/anj/      AI Cloud & Software Architect
#   ptd/     →  https://<username>.github.io/ptd/      AI Platform Engineer
#   pyj/     →  https://<username>.github.io/pyj/      AI Python Developer
#   dcr/     →  https://<username>.github.io/dcr/      AI Data Engineer
#   wnx/     →  https://<username>.github.io/wnx/      Full-Stack Web Developer
#   spx/     →  https://<username>.github.io/spx/      Backend & Software Developer
#   gaf/     →  https://<username>.github.io/gaf/      Go (GoLang) & Backend Developer
#   npx/     →  https://<username>.github.io/npx/      Node.js & Backend Developer
#   acon/    →  https://<username>.github.io/p/consulting/  Latest consulting version
#   root/index.html  →  https://<username>.github.io/
#
# One-time setup in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# After that, every push to main rebuilds and republishes the sites.
name: Build and deploy role sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      - name: Build all eight sites
        run: |
          set -euo pipefail
          mkdir -p _site
          for folder in anj ptd pyj dcr wnx spx gaf npx; do
            echo "::group::Building $folder"
            npm ci --prefix "$folder"
            npm run build --prefix "$folder"
            # Fail loudly rather than publishing an empty folder.
            test -f "$folder/dist/index.html" || {
              echo "::error::$folder/dist/index.html missing — build produced no output"
              exit 1
            }
            mkdir -p "_site/$folder"
            cp -R "$folder/dist/." "_site/$folder/"
            echo "::endgroup::"
          done

      - name: Add the root landing page and its assets
        run: cp -R root/. _site/

      - name: Publish the latest consulting version
        run: |
          set -euo pipefail
          npm ci --prefix acon
          npm run build --prefix acon

          latest_page="$(
            for page in acon/dist/v*/index.html; do
              version="${page#acon/dist/}"
              version="${version%/index.html}"
              if [[ -f "$page" && "$version" =~ ^v[1-9][0-9]*$ ]]; then
                printf '%s\n' "$page"
              fi
            done | sort -V | tail -n 1
          )"
          if [[ -z "$latest_page" ]]; then
            echo "::error::No numbered consulting build found in acon/dist"
            exit 1
          fi

          mkdir -p _site/consulting
          cp -R acon/dist/. _site/consulting/
          # The landing page moves up one directory. Rebase its HTML asset URLs.
          sed -E 's#((src|href)=")\.\./#\1./#g' "$latest_page" > _site/consulting/index.html
          echo "Published $latest_page as consulting/index.html"

      - name: Show what will be published
        run: find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
