# ---------------------------------------------------------------------------
# PROJECTS — real sites and systems, screenshotted from production.
# ---------------------------------------------------------------------------
projects:
  heading: "Selected work"
  subheading: "Backend systems and live sites I built or led — the API, the data layer, and what shipped."
  items:
    - title: "Stock Movers Predictor — market screener dashboard"
      org: "Personal project · live"
      slug: "stock-movers-predictor"
      image: "projects/stock-predictor.jpg"
      imageAlt: "Stock Movers Predictor dashboard in dark and light theme"
      tagline: "Full-stack screener predicting next-day gainers and losers from market data."
      problem: >
        Retail traders wanted a fast way to screen for likely next-day movers using pre/post
        market activity, momentum, and news sentiment, without scraping data by hand.
      approach: >
        Built a Python backend that pulls and scores market data (price, volume, relative
        volume, momentum, sector) into a confidence-ranked prediction, served through a REST
        API to a React data-grid frontend with live filtering, sorting, and theming.
      outcome: >
        A working end-to-end screener — ingestion, scoring API, and an interactive dashboard —
        refreshing ranked gainer/loser predictions with confidence scores in real time.
      tags: ["Python", "REST API", "React", "Data visualization", "Market data"]
      images:
        - src: "projects/stock-predictor-dark.jpg"
          alt: "Stock Movers Predictor dashboard, dark Nord theme, gainers table with confidence scores"
          caption: "Gainers view — dark theme, filterable by min price and volume, sortable columns."
        - src: "projects/stock-predictor-light.jpg"
          alt: "Stock Predictor dashboard, light theme, predicted move and confidence columns"
          caption: "Light theme variant with predicted move %, confidence, and 5-day momentum."

    - title: "Taheri Exchange — currency trading platform"
      org: "Client site · live"
      url: "https://taheriexchange.com/"
      image: "projects/currency-exchange.jpg"
      imageAlt: "Taheri Exchange currency conversion homepage"
      tagline: "Real-time currency calculator and rate-quote API for a Canadian FX brokerage."
      problem: >
        A currency exchange brokerage needed a public site that could quote live rates, run a
        two-way calculator, and convert visitors into "get a quote" and order requests.
      approach: >
        Built a backend rate-feed API serving live conversion rates to a two-way calculator,
        with the order and quote-request flows and the trust-building content around them.
      outcome: >
        A production FX site serving live conversion rates and lead capture for a business with
        36+ years in currency exchange.
      tags: ["REST API", "Real-time rates", "Node.js", "Lead capture"]

    - title: "Medtronic clinical analytics dashboard"
      org: "Medtronic"
      tagline: "Backend APIs and data layer for a physician-facing diabetes care dashboard."
      problem: >
        Clinicians needed to search patient status, review biometric trends, and get
        recommendations from a slow legacy admin tool that took nearly a minute to load.
      approach: >
        Built Python/FastAPI backend services over Oracle, MySQL and GraphQL, secured with
        SAML2/Cognito/SiteMinder, and cut load time with Redis caching and query optimization.
      outcome: >
        Backend performance improved 93% through caching and database optimization, dropping
        page load time in a regulated healthcare workflow.
      tags: ["Python", "FastAPI", "Redis", "GraphQL", "Healthcare", "PHI compliance"]

    - title: "Live Nation / Ticketmaster — presale, e-tickets & Apple Wallet"
      org: "Live Nation / Ticketmaster"
      tagline: "High-throughput ticketing backend and mobile e-ticket flow for millions of fans."
      problem: >
        Presale and on-sale processing took hours under peak demand, and physical tickets
        needed a fast backend path into Apple Wallet for mobile venue entry.
      approach: >
        Built dockerized, auto-scaling AWS microservices for seat reservation and e-ticket
        generation, with the Apple Wallet pass-generation APIs behind them in Python and Java.
      outcome: >
        10x throughput — hours reduced to minutes — and an Apple Wallet ticketing backend still
        used by millions of fans today.
      tags: ["Python", "Java", "AWS", "Apple Wallet", "Autoscaling", "Microservices"]

    - title: "Disney Parks & Resorts — ticketing, MagicBand & guest profile"
      org: "Disney Parks & Resorts"
      tagline: "End-to-end park-goer backend: login, will-call tickets, MagicBand assignment."
      problem: >
        Park guests needed one reliable flow to log in, purchase will-call tickets, and assign
        MagicBands to family members, with backend validation that couldn't fail at the gate.
      approach: >
        Built the ticket and profile services in Java/Spring Boot and Python, with JUnit and
        Selenium test suites covering login through confirmation on every release.
      outcome: >
        A ticketing and MagicBand assignment backend that shipped reliably across Disney World
        and Disneyland, with automated tests guarding every release.
      tags: ["Java", "Spring Boot", "Python", "PHP", "MySQL", "Selenium"]

    - title: "Intuit — Credit Karma AI risk estimator integration"
      org: "Intuit"
      tagline: "GraphQL and GenAI-enabled backend capabilities for internal engineering tools."
      problem: >
        Engineering teams needed real-time visibility into REST endpoint events and risk
        signals without switching context, and REST APIs were becoming a bottleneck for the
        frontends consuming them.
      approach: >
        Converted REST endpoints to GraphQL for faster, more flexible data-fetching, and
        integrated GenAI-driven Slack notifications for endpoint events, backed by Lambda and
        API Gateway services with strict security review.
      outcome: >
        REST-to-GraphQL migration shipped with a 35% data performance improvement, plus a
        secure internal Slack integration adopted by the engineering team.
      tags: ["GraphQL", "Node.js", "Python", "AWS Lambda", "GenAI"]

    - title: "Dr. K Plastic Surgery — practice marketing site"
      org: "Client site · live"
      url: "https://www.drkplasticsurgery.com/"
      image: "projects/drk-plastic-surgery.jpg"
      imageAlt: "Dr. K Plastic Surgery homepage hero section"
      tagline: "Editorial marketing site for a Beverly Hills plastic surgery practice."
      problem: >
        A high-end surgical practice needed a site that read as premium and trustworthy, with
        procedure content organized for both patients and search engines.
      approach: >
        Built a content-driven, image-forward site with clean typography and a fast, mobile-
        friendly layout, structured around consultation calls-to-action.
      outcome: >
        A polished, production marketing site driving consultation requests for a Beverly
        Hills practice.
      tags: ["PHP", "Responsive design", "SEO", "Performance"]

    - title: "Little Italy Pizza — restaurant ordering site"
      org: "Client site · live"
      url: "https://www.littleitalypizzany.com/"
      image: "projects/little-italy-pizza.jpg"
      imageAlt: "Little Italy Pizza homepage with order and menu navigation"
      tagline: "Ordering, catering, and pickup/delivery site for a Midtown Manhattan pizzeria."
      problem: >
        A New York pizzeria needed one site to route customers into ordering, catering
        inquiries, and app downloads, without confusing the primary "order now" action.
      approach: >
        Built a conversion-focused layout with a hero-level order CTA, a persistent utility bar
        for pickup/delivery, calling, and directions, and a menu/catering content structure.
      outcome: >
        A live ordering hub consolidating online orders, catering leads, and app installs into
        one page.
      tags: ["PHP", "Responsive design", "Conversion design"]

    - title: "Dwellco Homes — custom home builder site"
      org: "Client site · live"
      url: "https://dwellcohomes.com/"
      image: "projects/dwellco-homes.jpg"
      imageAlt: "Dwellco Homes homepage with design, build, renovate and manage services"
      tagline: "Portfolio and lead-generation site for a custom home design/build company."
      problem: >
        A design-build firm needed to showcase project photography and route four distinct
        service lines (design, build, renovate, manage) into one coherent site.
      approach: >
        Built a photography-led homepage with a clear four-service navigation structure and a
        projects/gallery section for past work, tied to a contact and market page.
      outcome: >
        A live portfolio site presenting the full design-build-renovate-manage service line to
        prospective homeowners.
      tags: ["PHP", "Responsive design", "Portfolio/gallery"]

