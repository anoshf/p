# ---------------------------------------------------------------------------
# POSITIONING — the "why this person for this exact role" argument.
# ---------------------------------------------------------------------------
positioning:
  heading: "Why I'm a fit for backend & software development work"
  subheading: >
    A team that hires me for backend work isn't locked into one language. I've shipped
    production APIs and services in seven of them, under real deadlines, for 15+ years.
  pillars:
    - title: "Backend APIs in whatever language the job needs"
      body: >
        Production REST and GraphQL services in Node.js/Express, Python (FastAPI/Django), Java
        (Spring Boot), Go, C# (ASP.NET), Ruby (Rails) and PHP (Laravel) — not a single-language
        specialist bolting on a second skill, but someone who's shipped all seven under deadline.
      tags: ["Node.js", "Python", "Java", "Go", "C#", "Ruby", "PHP", "REST", "GraphQL"]

    - title: "Performance and reliability work with numbers attached"
      body: >
        93% backend performance improvement through caching and database optimization at
        Medtronic. 35% data performance gain migrating REST to GraphQL at Intuit. 45% lower API
        latency through a microservices migration at ADP. I profile before I optimize and
        measure after.
      tags: ["Caching", "Query tuning", "Profiling", "Redis", "PostgreSQL", "Observability"]

    - title: "Cloud infrastructure and CI/CD, not just application code"
      body: >
        Serverless deployments on AWS Lambda and API Gateway with 99.99% uptime, Kubernetes and
        Terraform for continuous deployment, and CI/CD pipelines in Jenkins, GitLab and GitHub
        Actions that ship code safely and often.
      tags: ["AWS", "Kubernetes", "Terraform", "Docker", "CI/CD", "Serverless"]

