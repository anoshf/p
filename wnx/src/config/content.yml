# ---------------------------------------------------------------------------
# POSITIONING — the "why this person for this exact role" argument.
# ---------------------------------------------------------------------------
positioning:
  heading: "Why I'm a fit for full-stack web work"
  subheading: >
    Most web developers own the frontend and hand the API off to someone else. I've built
    both sides of that line for 15 years, in whatever language the backend was written in.
  pillars:
    - title: "Frontends people actually use, in production"
      body: >
        Ten-plus live consumer and B2B sites — from a currency exchange trading tool to a
        clinical dashboard to millions-of-users ticketing flows — built with React, Next.js,
        Angular and Vue, and the design/UX judgment to make them usable, not just functional.
      tags: ["React", "Next.js", "TypeScript", "Angular", "Vue", "Responsive design", "Accessibility"]

    - title: "Backend APIs in whatever language the job needs"
      body: >
        Production REST and GraphQL APIs in Python (FastAPI/Django), Node.js/Express, Java
        (Spring Boot), Go, C# (ASP.NET) and Ruby/PHP — not a single-language specialist bolting
        on a second skill, but someone who's shipped all six under real deadlines.
      tags: ["Python", "Node.js", "Java", "Go", "C#", "Ruby", "PHP", "REST", "GraphQL"]

    - title: "Performance and reliability work with numbers attached"
      body: >
        10x faster Apple Wallet APIs with Python, FastAPI and autoscaling. 60-second to 4-second
        load times on a clinical dashboard via Redis caching. 45% lower API latency through a
        microservices migration. I profile before I optimize and measure after.
      tags: ["Caching", "Query tuning", "Autoscaling", "Profiling", "CI/CD", "Observability"]

