# ---------------------------------------------------------------------------
# BEHAVIOUR
# ---------------------------------------------------------------------------
options:
  # Fade sections in as they scroll into view. Automatically disabled for
  # visitors who prefer reduced motion.
  animateOnScroll: true
  # The green "open to <role> roles" pill in the hero.
  showAvailabilityBadge: true
  # Sticky call-to-action bar on phones, appearing after the hero.
  showMobileStickyCta: true
  # Footer credit line. "" hides it.
  footerNote: ""
